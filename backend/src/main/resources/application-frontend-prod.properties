# Complemento externo do unico perfil sqlserver-prod, nunca segundo perfil ativo.
server.address=127.0.0.1
server.port=${WMS_PROD_PORT:25590}
server.forward-headers-strategy=none
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=false
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.flyway.enabled=false
spring.liquibase.enabled=false
wms.auth.enabled=true
wms.auth.origin=https://wms.rodogarcia.com.br
wms.auth.secure-cookie=true
wms.auth.proxy-origin=
wms.auth.bootstrap-hash=
spring.mvc.log-request-details=false
logging.level.com.zaxxer.hikari=OFF
logging.level.com.microsoft.sqlserver.jdbc=OFF
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
