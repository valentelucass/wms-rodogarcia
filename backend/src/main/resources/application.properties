spring.application.name=wms-rodogarcia
spring.profiles.default=local

# O perfil local inicia sem persistencia. sqlserver-dev substitui a lista inteira.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration
spring.jpa.open-in-view=false
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never
spring.flyway.enabled=false
spring.jackson.deserialization.fail-on-unknown-properties=true
# Valores decimais em Map/Object conservam o literal exato em hashes e efeitos.
spring.jackson.deserialization.use-big-decimal-for-floats=true
spring.mvc.log-request-details=false
spring.servlet.multipart.enabled=true

server.address=127.0.0.1
server.port=${WMS_PORT:8080}
# Comporta os dois alcances JWT de ate 500 IDs Long e sujeito de ate 200 caracteres.
server.max-http-request-header-size=64KB
# Drena recusas proximas ao limite de 6MB para entregar a resposta 413.
server.tomcat.max-swallow-size=7MB
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.whitelabel.enabled=false

# O driver pode expor valores e SQL; o handler registra apenas identificadores seguros.
logging.level.org.hibernate.orm.jdbc.error=OFF
logging.pattern.level=%5p [operacao=%X{idOperacao:-}]
wms.cadastros.enabled=false

# D32: material de autenticação externo, nunca valor literal versionado.
wms.auth.enabled=${WMS_AUTH_ENABLED:false}
wms.auth.private-key=${WMS_AUTH_PRIVATE_KEY:}
wms.auth.bootstrap-hash=${WMS_AUTH_BOOTSTRAP_HASH:}
wms.auth.origin=${WMS_AUTH_ORIGIN:}
wms.auth.proxy-origin=${WMS_AUTH_PROXY_ORIGIN:}
wms.auth.secure-cookie=${WMS_AUTH_SECURE_COOKIE:true}

wms.importacao-enderecos.bytes-max=5242880
wms.importacao-enderecos.linhas-max=5000
wms.importacao-enderecos.expandido-max=52428800
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
