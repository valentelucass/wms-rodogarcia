# PROD-LAUNCH01: perfil unico de producao; nenhum fallback DEV/administrativo.
spring.autoconfigure.exclude=
wms.cadastros.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=false
spring.sql.init.mode=never
spring.flyway.enabled=false
spring.liquibase.enabled=false
wms.database.host=${WMS_PROD_DB_HOST}
wms.database.port=${WMS_PROD_DB_PORT}
wms.database.name=WMS_PROD
wms.database.user=WMSPROD
wms.database.password=${WMS_PROD_DB_PASSWORD}
wms.database.confirmed-target=${WMS_PROD_DB_CONFIRMED_TARGET}
wms.database.confirmed-server=${WMS_PROD_DB_CONFIRMED_SERVER}
wms.database.tls.certificate-host=${WMS_PROD_DB_CERTIFICATE_HOST}
wms.database.tls.trust-store=${WMS_PROD_DB_TRUST_STORE}
wms.database.tls.trust-store-password=${WMS_PROD_DB_TRUST_STORE_PASSWORD}
logging.level.com.zaxxer.hikari=OFF
logging.level.com.microsoft.sqlserver.jdbc=OFF
wms.identity.issuer=${WMS_PROD_AUTH_ISSUER}
wms.identity.jwk-set-uri=${WMS_PROD_AUTH_JWK_SET_URI}
wms.identity.audience=${WMS_PROD_AUTH_AUDIENCE}
wms.auth.enabled=true
wms.auth.private-key=${WMS_PROD_AUTH_PRIVATE_KEY}
# Ausencia do principal em PROD bloqueia startup, sem bootstrap neste launcher.
wms.auth.bootstrap-hash=
