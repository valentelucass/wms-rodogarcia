# D31-DEV02: complemento externo do perfil existente sqlserver-dev.
# Nao ativar "frontend-dev": AmbienteConfig admite somente um perfil conhecido.
# Carregar por spring.config.additional-location apenas depois da guarda atual
# WMS_DEV/WMSDEV/TLS/permissoes/catalogo aprovada. Nenhum PASS presumido.
# Este arquivo nao executa a guarda nem importa credenciais.
server.address=127.0.0.1
server.port=${WMS_PORT:8080}
wms.database.name=WMS_DEV
wms.database.user=WMSDEV
spring.jpa.open-in-view=false
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.flyway.enabled=false
spring.liquibase.enabled=false
# BE14-INVENTARIO01: estrutura V14 e permissoes conferidas no WMS_DEV em 23/10/2026.
# O perfil geral continua desativado por padrao; esta configuracao e exclusiva DEV.
wms.inventario.enabled=true
