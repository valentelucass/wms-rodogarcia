# Ativar somente apos definir e conferir o alvo exclusivo de desenvolvimento.
spring.autoconfigure.exclude=
wms.cadastros.enabled=true
wms.database.host=${WMS_DB_HOST}
wms.database.port=${WMS_DB_PORT:1433}
wms.database.name=${WMS_DB_NAME}
wms.database.user=${WMS_DB_USER}
wms.database.password=${WMS_DB_PASSWORD}
wms.database.confirmed-target=${WMS_DB_CONFIRMED_TARGET}
wms.database.confirmed-server=${WMS_DB_CONFIRMED_SERVER}
# Consumir o perfil publico/protegido do cliente; nao importar credencial administrativa.
wms.database.tls.certificate-host=${WMS_DB_CERTIFICATE_HOST:}
wms.database.tls.trust-store=${WMS_DB_TRUST_STORE:}
wms.database.tls.trust-store-password=${WMS_DB_TRUST_STORE_PASSWORD:}
# Configuracao do pool/driver pode conter material protegido: nao imprimir em DEBUG.
logging.level.com.zaxxer.hikari=OFF
logging.level.com.microsoft.sqlserver.jdbc=OFF
wms.identity.issuer=${WMS_OIDC_ISSUER}
wms.identity.jwk-set-uri=${WMS_OIDC_JWK_SET_URI}
wms.identity.audience=${WMS_OIDC_AUDIENCE}
